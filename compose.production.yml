services:
  roomwave:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "3000"
      ROOMWAVE_DB_PATH: /app/data/roomwave.sqlite
      ROOMWAVE_SERVE_WEB: "1"
      ROOMWAVE_TRUSTED_PROXY_IPS: 127.0.0.1,::1
      ROOMWAVE_ALLOWED_ORIGINS: ${ROOMWAVE_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - roomwave_data:/app/data

volumes:
  roomwave_data:
